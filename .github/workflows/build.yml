name: Build

# Builds and tests the plug-in on macOS and Windows.
# Pushing a tag like v0.1.0 also publishes a GitHub release with both packages.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then
            cmake -B build -DCMAKE_BUILD_TYPE=Release "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          else
            cmake -B build
          fi

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="dev-${GITHUB_SHA::7}"
          fi

          artefacts="build/Semitone_artefacts/Release"
          mkdir -p dist/Semitone

          if [ "$RUNNER_OS" = "macOS" ]; then
            ditto "$artefacts/VST3/Semitone.vst3" dist/Semitone/Semitone.vst3
            ditto "$artefacts/AU/Semitone.component" dist/Semitone/Semitone.component
            ditto "$artefacts/Standalone/Semitone.app" dist/Semitone/Semitone.app
            cp packaging/INSTALL-macOS.txt dist/Semitone/INSTALL.txt

            # ad-hoc signature (no Developer ID): enough for the binaries to load once un-quarantined
            for bundle in dist/Semitone/Semitone.vst3 dist/Semitone/Semitone.component dist/Semitone/Semitone.app; do
              codesign --force --deep --sign - "$bundle"
              lipo -archs "$bundle/Contents/MacOS/Semitone"
            done

            (cd dist && ditto -c -k --keepParent Semitone "Semitone-$version-macOS.zip")
          else
            cp -R "$artefacts/VST3/Semitone.vst3" dist/Semitone/Semitone.vst3
            cp "$artefacts/Standalone/Semitone.exe" dist/Semitone/Semitone.exe
            cp packaging/INSTALL-Windows.txt dist/Semitone/INSTALL.txt
            (cd dist && 7z a "Semitone-$version-Windows.zip" Semitone)
          fi

          ls -la dist

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: dist/*.zip
          if-no-files-found: error

      - name: Upload UI renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-${{ matrix.name }}
          path: build/ui*.png
          if-no-files-found: warn

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # the release already exists (the tag was rebuilt): refresh its files and notes
            gh release upload "$GITHUB_REF_NAME" dist/*.zip --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          else
            gh release create "$GITHUB_REF_NAME" dist/*.zip \
              --title "Semitone ${GITHUB_REF_NAME#v}" \
              --notes-file RELEASE_NOTES.md
          fi
